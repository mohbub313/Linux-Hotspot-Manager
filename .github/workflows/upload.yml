name: Extract Source Files
on: [push]
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Archive
        run: |
          tar -xzf *.tar.gz --strip-components=1 || tar -xzf *.tar.gz
          rm *.tar.gz
      - name: Commit Source Files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Automated extraction of full project source" || exit 0
          git push
