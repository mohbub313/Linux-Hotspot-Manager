<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.shazid.LinuxHotspotManager"/>
    <allow send_destination="com.shazid.LinuxHotspotManager"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="com.shazid.LinuxHotspotManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.shazid.LinuxHotspotManager"/>
  </policy>
</busconfig>
